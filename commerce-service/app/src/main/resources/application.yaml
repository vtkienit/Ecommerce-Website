server:
  port: ${COMMERCE_SERVICE_PORT:8083}

spring:
  application:
    name: commerce-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: ${COMMERCE_DB_URL:${DB_URL}}
    username: ${COMMERCE_DB_USERNAME:${DB_USERNAME}}
    password: ${COMMERCE_DB_PASSWORD:${DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${COMMERCE_DB_SCHEMA:commerce}
        default_batch_fetch_size: 50
        batch_fetch_style: DYNAMIC
        hbm2ddl:
          create_namespaces: true

  flyway:
    schemas: ${COMMERCE_DB_SCHEMA:commerce}
    default-schema: ${COMMERCE_DB_SCHEMA:commerce}
    baseline-on-migrate: true
    baseline-version: 1

security:
  jwt:
    secret: ${JWT_SECRET}

catalog:
  service:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8082}

commerce:
  inventory:
    default-stock: ${COMMERCE_DEFAULT_STOCK:10}
    low-stock-threshold: 5
    seed:
      enabled: ${COMMERCE_INVENTORY_SEED_ENABLED:true}
  returns:
    window-days: 7

payment:
  payos:
    client-id: ${PAYOS_CLIENT_ID}
    api-key: ${PAYOS_API_KEY}
    checksum-key: ${PAYOS_CHECKSUM_KEY}
    return-url: ${PAYOS_RETURN_URL:http://localhost:5173/payment/success}
    cancel-url: ${PAYOS_CANCEL_URL:http://localhost:5173/payment/cancel}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
