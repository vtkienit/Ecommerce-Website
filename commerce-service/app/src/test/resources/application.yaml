spring:
  datasource:
    url: jdbc:h2:mem:commerce-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS commerce
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: commerce
        hbm2ddl:
          create_namespaces: true
  flyway:
    enabled: false

security:
  jwt:
    secret: commerce-test-secret-with-at-least-32-bytes

catalog:
  service:
    base-url: http://catalog.test

commerce:
  inventory:
    default-stock: 10
    seed:
      enabled: false

payment:
  payos:
    client-id: test-client-id
    api-key: test-api-key
    checksum-key: test-checksum-key
    return-url: http://localhost:5173/payment/success
    cancel-url: http://localhost:5173/payment/cancel

app:
  cors:
    allowed-origins: http://localhost:5173
