spring:
  datasource:
    url: jdbc:h2:mem:commerce-service;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;INIT=CREATE SCHEMA IF NOT EXISTS commerce
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        default_schema: commerce
        hbm2ddl:
          create_namespaces: true

security:
  jwt:
    secret: commerce-test-secret-with-at-least-32-bytes

catalog:
  service:
    base-url: http://catalog.test

commerce:
  inventory:
    default-stock: 10

app:
  cors:
    allowed-origins: http://localhost:5173
