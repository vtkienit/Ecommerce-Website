server:
  port: ${CATALOG_SERVICE_PORT:8081}

spring:
  application:
    name: catalog-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: ${CATALOG_DB_URL:${DB_URL}}
    username: ${CATALOG_DB_USERNAME:${DB_USERNAME}}
    password: ${CATALOG_DB_PASSWORD:${DB_PASSWORD}}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: ${CATALOG_DB_SCHEMA:catalog}
        default_batch_fetch_size: 50
        batch_fetch_style: DYNAMIC
        hbm2ddl:
          create_namespaces: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 55MB

security:
  jwt:
    secret: ${JWT_SECRET}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

catalog:
  seed:
    enabled: ${CATALOG_SEED_ENABLED:true}

supabase:
  storage:
    url: ${SUPABASE_URL:}
    secret-key: ${SUPABASE_SECRET_KEY:}
    bucket: product-images
    max-file-size-bytes: 5242880
