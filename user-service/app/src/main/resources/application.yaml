server:
  port: ${USER_SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

spring:
  application:
    name: user-service

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}

  refresh-token:
    expiration-seconds: ${REFRESH_TOKEN_EXPIRATION_SECONDS:2592000}
    cookie-secure: ${REFRESH_TOKEN_COOKIE_SECURE:false}
    cookie-same-site: ${REFRESH_TOKEN_COOKIE_SAME_SITE:Lax}

  password-reset:
    secret: ${PASSWORD_RESET_SECRET:${JWT_SECRET}}
    code-ttl-seconds: ${PASSWORD_RESET_CODE_TTL_SECONDS:300}
    token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:600}
    resend-delay-seconds: ${PASSWORD_RESET_RESEND_DELAY_SECONDS:60}
    max-attempts: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    max-requests-per-hour: ${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:5}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}

resend:
  api-key: ${RESEND_API_KEY:}
  from-email: "${RESEND_FROM_EMAIL:QuyDung <onboarding@resend.dev>}"

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
