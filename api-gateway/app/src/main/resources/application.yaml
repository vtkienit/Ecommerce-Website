server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      repositories:
        enabled: false

  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: Authorization,Content-Type
                exposed-headers: Authorization
                allow-credentials: true
                max-age: 3600
          httpclient:
            connect-timeout: 3000
            response-timeout: 60s
          routes:
            - id: notification-websocket
              uri: ${COMMERCE_WEBSOCKET_URL:ws://localhost:8083}
              predicates:
                - Path=/ws/notifications

            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**,/api/users/**

            - id: catalog-admin
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/admin/catalog/**

            - id: catalog-public
              uri: ${CATALOG_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/categories/**,/api/products/**,/api/variants/**,/api/flash-sales/**

            - id: commerce-service
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/cart/**,/api/orders/**,/api/payments/**,/api/vouchers/**,/api/inventory/**,/api/admin/dashboard/**,/api/admin/inventory/**,/api/admin/orders/**,/api/admin/vouchers/**,/api/admin/returns/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

security:
  jwt:
    secret: ${JWT_SECRET}
